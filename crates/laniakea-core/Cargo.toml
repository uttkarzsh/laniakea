[package]
name = "laniakea-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Core zk stack (always)
ark-groth16   = { workspace = true }
ark-bn254     = { workspace = true }
ark-std       = { workspace = true }
ark-serialize = { workspace = true }
ark-snark     = { workspace = true }
ark-relations = { workspace = true }
ark-ff        = { workspace = true }
ark-poly      = { workspace = true }
num-bigint    = { workspace = true }
anyhow        = { workspace = true }
thiserror     = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
rand          = { workspace = true }

# Portable witness generation (Wasmi interpreter, pure Rust). Used on every
# platform, including iOS: this is the only witness engine the Prover uses.
wasmi-witness = { path = "../wasmi-witness" }

# Desktop-only: ark-circom for zkey/R1CS parsing and the reference witness engine.
# Never part of the iOS dependency graph.
[target.'cfg(not(target_os = "ios"))'.dependencies]
ark-circom    = { workspace = true }
tempfile      = "3"
