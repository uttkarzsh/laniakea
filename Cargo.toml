[workspace]
name = "laniakea"
version = "0.1.0"
edition = "2021"
members = [
    "crates/laniakea-core",
    "crates/laniakea-cli",
    "crates/laniakea-uniffi",
    "crates/wasmi-witness",
]
resolver = "2"

[workspace.dependencies]
# zk stack
ark-circom       = { path = "vendor/ark-circom", default-features = false, features = ["circom-2"] }
ark-groth16      = { version = "0.4", default-features = false, features = ["r1cs"] }
ark-bn254        = { version = "0.4", default-features = false, features = ["curve"] }
ark-std          = { version = "0.4", default-features = false }
ark-serialize    = { version = "0.4", default-features = false }
num-bigint       = { version = "0.4", default-features = false, features = ["rand"] }

# wasmer (required by ark-circom for desktop witness gen)
wasmer           = { version = "=2.3.0", default-features = false, features = ["sys", "cranelift", "universal"] }

# iOS witness generation
wasmi            = { version = "2.0", default-features = true }

# utilities
anyhow           = "1"
thiserror        = "1"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

# FFI
uniffi           = "0.28"